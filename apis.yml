name: Freckle Education
description: >-
  Freckle is an adaptive learning platform from Renaissance that delivers
  differentiated, standards-aligned math and English Language Arts (ELA) practice
  for K-12 students. Teachers assign work and monitor progress while students
  practice at their own level, with the platform adapting question difficulty to
  each learner across 70,000+ math questions and 1,000+ ELA passages.
  Administrators manage rosters and dashboards at the school and district level.
  Freckle is a school- and classroom-facing application acquired by Renaissance
  Learning; it does not currently publish a public developer API, SDKs, or a
  developer portal, so this profile captures its identity, published web
  properties, and probed domain-security posture rather than API artifacts.
